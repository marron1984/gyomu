<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>A勤 業務チェックリスト</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="appHeader" class="app-header hidden">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-mark">✓</span>
        <span class="brand-text">A勤 業務チェックリスト</span>
      </div>
      <div class="header-right">
        <span id="userBadge" class="user-badge"></span>
        <button id="pwBtn" class="btn-ghost" type="button">パスワード変更</button>
        <button id="logoutBtn" class="btn-ghost" type="button">ログアウト</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast hidden"></div>

  <!-- パスワード変更モーダル -->
  <div id="pwModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>パスワード変更</h3>
      <label>現在のパスワード<input type="password" id="pwCurrent" /></label>
      <label>新しいパスワード（6文字以上）<input type="password" id="pwNext" /></label>
      <div class="modal-actions">
        <button class="btn-ghost" type="button" data-close-pw>キャンセル</button>
        <button class="btn-primary" type="button" id="pwSave">変更する</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
